[pytest]
asyncio_mode = auto

# Default discovery covers only the mocked-DB unit suite (tests/) — the fast,
# no-external-dependency 367 tests that `README.md` and CI (once it exists)
# both expect to run with a bare `pytest`. tests_integration/ needs a real,
# reachable MongoDB and is a genuinely different kind of test (real HTTP
# requests through the real app, real writes) — it's run explicitly:
#
#     pytest tests_integration/ -q
#
# never picked up by accident by a bare `pytest` from this directory.
testpaths = tests
